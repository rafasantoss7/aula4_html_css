<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizando CSS interno na página</title>
    <!-- CSS interno sempre fica no head da página -->
     <style>
        /* Adicionando CSS a TAG p */
        p {
            color: blueviolet;
            font-size: 23px;
        }
        h1{
            color: blue;
        }
        s{
            font-size: 25px;
        }
     </style>
</head>
<body>
    <p>CSS Interno da página</p>
    <p>Teste</p>
    <h1>Não sei</h1>
    <s>Qualquer coisa</s>
</body>
</html>
