<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS interno com classe e id</title>
    <!-- CSS interno dentro do HEAD! -->
     <style>
        /* Indica mudanças no plano de fundo */
        * {
            background-color: rgb(210, 255, 240);
            margin: 0;
            padding: 0;
        }
        /* # PARA A MARCAÇÃO DE ID!! */
        #paragrafo{
            font-size:25px;
            background-color: rgb(0, 119, 141);
            color: white;
        }
        #informacoes{
            background-color: rgb(0, 149, 157);
            font-size: 30px;
            text-align: center;
        }
        /* Ponto final no começo indica classe! */
        .titulo{
            background-color: rgb(0, 205, 205);
            text-align: right;
            font-weight: bold;
        }
        /* Mudança na tag a dentro da div */
        div a{
            color: rgb(94, 119, 86);
        }
        div p{
            color: black;
        }
     </style>
</head>
<body>
   <p id="paragrafo">CSS aplicado no id</p> 
   <p id="informacoes">Informações complementares</p>

   <h3 class="titulo">CSS aplicado na classe</h3>
   <p class="titulo">Informações com classe</p>

<!-- Classe na tabela -->
   <table border="1">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="titulo">Rafaela</td>
            <td>16</td>
        </tr>
    </tbody>
   </table>
   <div>
        <a href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvnfOVf9mnfrkbDAGyg_E8pO5EVxvGv_jU9yPMj3dutZrQYiBRAonsp9rD&s=10">Primeiro link</a>
        <p>Qualquer coisa</p>
   </div>
</body>
</html>
